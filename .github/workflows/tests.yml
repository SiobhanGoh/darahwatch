name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      # A whole daily run on the frozen snapshot, in a scratch folder, so nothing real is touched.
      - name: Full run on the snapshot
        run: |
          tmp="$(mktemp -d)"
          cp -r evaluation "$tmp/"
          python -m darahwatch.run --data snapshot --root "$tmp"
          python -c "import json,sys; p=json.load(open(sys.argv[1])); assert len(p['days'])==13*4*14 and len(p['weeks'])==13*4*2, 'wrong size'" "$tmp/latest/forecast.json"
